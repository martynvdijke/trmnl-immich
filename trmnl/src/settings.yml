strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 2.3.7
serverless_language: ''
polling_url: "{{url}}/api/trmnl/photo-of-the-day?album_id={{album_id}}&person_id={{person_id}}"
polling_headers: ''
polling_body: ''
id: ''
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
  - keyname: url
    name: 'Address of the trmnl-immich backend'
    field_type: url
    description: 'The public URL of your trmnl-immich backend'
    placeholder: 'https://immich.example.com'
    help_text: 'Please include http:// or https://'
  - keyname: album_id
    name: 'Album ID'
    field_type: text
    description: 'Optional: restrict photos to this album'
    placeholder: 'Leave empty for your whole library'
    help_text: 'Find it in the Immich web UI or via GET /api/albums'
  - keyname: person_id
    name: 'Person ID'
    field_type: text
    description: 'Optional: restrict photos to this person'
    placeholder: 'Leave empty for your whole library'
    help_text: 'Find it in the Immich web UI or via GET /api/people'
name: 'Immich Photo of the Day'
description: 'A random photo from your Immich library'
refresh_interval: 1440
